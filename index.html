<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>今天吃什么 · 长沙口味转盘</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#fff7ed,#fee2e2);
    color:#1f2937;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .app{
    width:min(980px,100%);
    background:rgba(255,255,255,.92);
    border-radius:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.12);
    padding:24px;
  }
  h1{margin:0 0 6px;font-size:30px}
  .sub{color:#6b7280;margin-bottom:20px}
  .grid{
    display:grid;
    grid-template-columns:minmax(300px,1fr) minmax(280px,.8fr);
    gap:24px;
  }
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .wheel-wrap{
    position:relative;
    width:min(520px,90vw);
    aspect-ratio:1;
    margin:auto;
  }
  canvas{
    width:100%;
    height:100%;
    display:block;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.15));
  }
  .pointer{
    position:absolute;
    top:50%;
    right:-2px;
    transform:translateY(-50%);
    width:0;height:0;
    border-top:18px solid transparent;
    border-bottom:18px solid transparent;
    border-right:0;
    border-left:34px solid #111827;
    z-index:3;
  }
  .center{
    position:absolute;
    inset:50% auto auto 50%;
    transform:translate(-50%,-50%);
    width:96px;height:96px;
    background:#111827;
    color:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-weight:800;
    cursor:pointer;
    user-select:none;
    box-shadow:0 8px 18px rgba(0,0,0,.25);
  }
  .panel{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .result{
    border-radius:18px;
    padding:18px;
    background:#111827;
    color:#fff;
    text-align:center;
  }
  .result small{opacity:.72}
  .result strong{display:block;font-size:26px;margin-top:8px}
  button{
    border:none;
    border-radius:14px;
    padding:13px 16px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .primary{background:#ef4444;color:#fff}
  .secondary{background:#f3f4f6;color:#111827}
  .danger{background:#fff1f2;color:#be123c}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .filters{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  select,label{
    font-size:14px;
  }
  select{
    width:100%;
    margin-top:5px;
    padding:10px 12px;
    border:1px solid #d1d5db;
    border-radius:12px;
    background:#fff;
  }
  .history{
    max-height:220px;
    overflow:auto;
    background:#f9fafb;
    border-radius:14px;
    padding:12px;
    font-size:14px;
  }
  .history b{display:block;margin-bottom:8px}
  .tag{
    display:inline-block;
    padding:5px 8px;
    margin:3px;
    border-radius:999px;
    background:#fff;
    border:1px solid #e5e7eb;
  }
  .note{
    font-size:13px;
    color:#6b7280;
    line-height:1.5;
  }
</style>
</head>
<body>
<div class="app">
  <h1>今天吃什么 · 长沙口味转盘 🌶️</h1>
  <div class="sub">湘味优先，也混了全国常见好吃的。抽过的菜会进入“近期历史”，优先避免重复。</div>

  <div class="grid">
    <div class="wheel-wrap">
      <canvas id="wheel" width="700" height="700"></canvas>
      <div class="pointer"></div>
      <div class="center" id="spinCenter">点我<br>开转</div>
    </div>

    <div class="panel">
      <div class="result">
        <small>今天就吃</small>
        <strong id="resultText">还没抽</strong>
      </div>

      <div class="filters">
        <label>类型
          <select id="typeFilter">
            <option value="all">全部</option>
            <option value="正餐">正餐</option>
            <option value="粉面">粉面</option>
            <option value="夜宵">夜宵</option>
            <option value="小吃">小吃</option>
            <option value="清淡">清淡</option>
          </select>
        </label>
        <label>辣度
          <select id="spicyFilter">
            <option value="all">随便</option>
            <option value="辣">想吃辣</option>
            <option value="不辣">今天不辣</option>
          </select>
        </label>
      </div>

      <button class="primary" id="spinBtn">🎡 随机转一次</button>

      <div class="row">
        <button class="secondary" id="againBtn">不想吃，再来</button>
        <button class="danger" id="resetBtn">清空历史</button>
      </div>

      <div class="history" id="historyBox">
        <b>最近抽到</b>
        <div id="historyList">暂无</div>
      </div>

      <div class="note">
        规则：优先从最近没抽到过的食物里选；当可选项快被抽完时会自动放开旧记录，所以不容易连续重复。
      </div>
    </div>
  </div>
</div>

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const resultText = document.getElementById("resultText");
const typeFilter = document.getElementById("typeFilter");
const spicyFilter = document.getElementById("spicyFilter");
const historyList = document.getElementById("historyList");

let currentRotation = 0;
let spinning = false;
let history = JSON.parse(localStorage.getItem("foodHistory") || "[]");

function getFiltered(){
  const t = typeFilter.value;
  const s = spicyFilter.value;
  return foods.filter(f => (t==="all" || f[1]===t) && (s==="all" || f[2]===s));
}

function getPool(){
  const filtered = getFiltered();
  const recentWindow = Math.min(40, Math.max(12, Math.floor(filtered.length * 0.35)));
  const recent = new Set(history.slice(0,recentWindow));
  let pool = filtered.filter(f => !recent.has(f[0]));
  if(pool.length < Math.min(8, filtered.length)) pool = filtered;
  return pool;
}

function drawWheel(){
  const list = getFiltered();
  const cx = canvas.width/2, cy = canvas.height/2, r = 320;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const visible = list.length > 36 ? 36 : list.length;
  const sample = [];
  if(list.length <= visible){
    sample.push(...list);
  } else {
    const step = list.length/visible;
    for(let i=0;i<visible;i++) sample.push(list[Math.floor(i*step)]);
  }

  const n = sample.length || 1;
  for(let i=0;i<n;i++){
    const a0 = (i/n)*Math.PI*2;
    const a1 = ((i+1)/n)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,a0,a1);
    ctx.closePath();
    ctx.fillStyle = i%2===0 ? "#ef4444" : "#f97316";
    ctx.fill();

    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate((a0+a1)/2);
    ctx.textAlign="right";
    ctx.fillStyle="#fff";
    ctx.font="bold 20px system-ui";
    const name = sample[i]?.[0] || "没东西";
    ctx.fillText(name.length>7 ? name.slice(0,7)+"…" : name, r-18, 7);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(cx,cy,118,0,Math.PI*2);
  ctx.fillStyle="#111827";
  ctx.fill();
}

function updateHistory(){
  historyList.innerHTML = history.length
    ? history.slice(0,18).map(x=>`<span class="tag">${x}</span>`).join("")
    : "暂无";
}

function chooseFood(){
  const pool = getPool();
  if(!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

function spin(){
  if(spinning) return;
  const selected = chooseFood();
  if(!selected){
    resultText.textContent = "没有符合条件的食物";
    return;
  }
  spinning = true;
  resultText.textContent = "转盘正在决定…";

  const extraTurns = 6 + Math.floor(Math.random()*4);
  const randomDeg = Math.floor(Math.random()*360);
  currentRotation += extraTurns*360 + randomDeg;

  canvas.style.transition = "transform 3.8s cubic-bezier(.17,.67,.13,1)";
  canvas.style.transform = `rotate(${currentRotation}deg)`;

  setTimeout(()=>{
    resultText.textContent = selected[0];
    history = [selected[0], ...history.filter(x=>x!==selected[0])].slice(0,80);
    localStorage.setItem("foodHistory", JSON.stringify(history));
    updateHistory();
    spinning = false;
  },3900);
}

document.getElementById("spinBtn").onclick = spin;
document.getElementById("spinCenter").onclick = spin;
document.getElementById("againBtn").onclick = spin;

document.getElementById("resetBtn").onclick = ()=>{
  history = [];
  localStorage.removeItem("foodHistory");
  updateHistory();
  resultText.textContent = "历史已清空";
};

typeFilter.onchange = drawWheel;
spicyFilter.onchange = drawWheel;

drawWheel();
updateHistory();
</script>
